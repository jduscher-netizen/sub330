name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Datenbank D1 anlegen (falls neu) und ID eintragen
        run: |
          set -euo pipefail
          find_id() { npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const db=JSON.parse(s).find(d=>d.name==="sub330");process.stdout.write(db?db.uuid:"")})'; }
          ID="$(find_id)"
          if [ -z "$ID" ]; then
            echo "Lege Datenbank sub330 an"
            npx wrangler d1 create sub330 --location weur
            ID="$(find_id)"
          fi
          echo "Datenbank-ID: $ID"
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml cron/wrangler.toml

      - name: Datenbank-Migrationen anwenden
        run: npx wrangler d1 migrations apply sub330 --remote

      - name: App bauen
        run: npm run build

      - name: Pages-Projekt anlegen (falls neu)
        run: npx wrangler pages project create sub330 --production-branch main || echo "Projekt existiert bereits"

      - name: Login-Passwort an Cloudflare übergeben
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          if [ -z "${APP_PASSWORD}" ]; then
            echo "::warning::GitHub-Secret APP_PASSWORD fehlt, die App bleibt gesperrt."
          else
            printf '%s' "$APP_PASSWORD" | npx wrangler pages secret put APP_PASSWORD --project-name sub330
          fi

      - name: Token für den Sync-Knopf an Cloudflare übergeben
        env:
          GH_ACTIONS_TOKEN: ${{ secrets.GH_ACTIONS_TOKEN }}
        run: |
          if [ -z "${GH_ACTIONS_TOKEN}" ]; then
            echo "::warning::GitHub-Secret GH_ACTIONS_TOKEN fehlt, der Knopf Jetzt synchronisieren bleibt aus."
          else
            printf '%s' "$GH_ACTIONS_TOKEN" | npx wrangler pages secret put GH_ACTIONS_TOKEN --project-name sub330
          fi

      - name: Veröffentlichen
        run: npx wrangler pages deploy dist --project-name sub330 --branch main --commit-dirty=true

      # Eigener Schritt: ein Fehler hier darf das Veröffentlichen der App nicht verhindern
      - name: Zeitplan für den Garmin-Sync (Worker sub330-cron)
        continue-on-error: true
        env:
          GH_ACTIONS_TOKEN: ${{ secrets.GH_ACTIONS_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler deploy --config cron/wrangler.toml
          if [ -n "${GH_ACTIONS_TOKEN}" ]; then
            printf '%s' "$GH_ACTIONS_TOKEN" | npx wrangler secret put GH_ACTIONS_TOKEN --config cron/wrangler.toml
          fi
