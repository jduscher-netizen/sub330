name: Garmin-Sync

# Gestartet über workflow_dispatch: stündlich vom Cloudflare Worker sub330-cron (cron/),
# per Sync-Knopf in der App oder von Hand. Der GitHub-Zeitplan war zu unzuverlässig.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Tage zurück (leer = normaler Sync, z. B. 56 = 8 Wochen Historie, maximal 120)"
        required: false
        default: ""

concurrency:
  group: garmin
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r sync/requirements.txt

      - name: Garmin synchronisieren
        working-directory: sync
        env:
          SYNC_DAYS: ${{ inputs.days }}
        run: python garmin_sync.py
