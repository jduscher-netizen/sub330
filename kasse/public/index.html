<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haushaltskasse</title>
<meta name="theme-color" content="#F3F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kasse">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Eine schmale Spalte wie ein Kassenbuch: Bilanz oben als einziges kräftiges Element,
   darunter Kategorien, Buchungen nach Tagen, Monate. Eintragen über den Knopf unten. */
:root {
  --bg: #F3F4EF; --surface: #FFFFFF; --ink: #1A1F1C; --muted: #646C66; --line: #DCE0D8; --bar: #C9D3CB;
  --accent: #1F6B47; --on-accent: #FFFFFF;
  --jan: #2D57D6; --mil: #C93E66; --jan-soft: #E6ECFD; --mil-soft: #FBE7ED; --warn: #9A5B00;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Instrument Sans", "Helvetica Neue", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111412; --surface: #1A1E1C; --ink: #ECEFEA; --muted: #9AA39D; --line: #2A302C; --bar: #3A4A40;
    --accent: #4CC38A; --on-accent: #0D1A13;
    --jan: #86A2FF; --mil: #FF8DAA; --jan-soft: #1C2440; --mil-soft: #3A1D27; --warn: #E8A64A;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45;
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 26px; padding-top: 10px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }

/* Kopf */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 17px; letter-spacing: .01em; display: flex; align-items: center; gap: 8px; }
.brand .half { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: 15px; }
.me { min-height: 44px; border: 0; background: none; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; padding: 0; }
.monthnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.monthnav h1 { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1.05; margin: 0; text-align: center; }
.monthnav h1 span { color: var(--muted); font-weight: 600; }
.navbtn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.navbtn:disabled { opacity: .3; cursor: default; }
.navbtn svg { width: 18px; height: 18px; }

.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; }
.banner button { border: 0; background: none; color: var(--accent); font-weight: 600; min-height: 44px; padding: 0; white-space: nowrap; }

/* Bilanz */
.bilanz { background: var(--surface); border-radius: 18px; padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 1px 0 var(--line), 0 12px 30px -20px rgba(0,0,0,.3); }
.verdict { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.verdict .who { font-size: 15px; color: var(--muted); }
.verdict .who b { color: var(--ink); font-weight: 600; }
.verdict .big { font-family: var(--display); font-weight: 800; font-size: 50px; line-height: 1; letter-spacing: -.02em; display: block; margin-top: 4px; }
.copy { border: 1px solid var(--line); background: transparent; border-radius: 10px; min-height: 40px; padding: 0 12px; font-size: 14px; font-weight: 600; flex: none; }
.dot { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
.dot.j { background: var(--jan-soft); color: var(--jan); }
.dot.m { background: var(--mil-soft); color: var(--mil); }
.split { position: relative; height: 12px; border-radius: 6px; overflow: hidden; display: flex; background: var(--line); }
.split .sj { background: var(--jan); } .split .sm { background: var(--mil); flex: 1; }
.split .mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--surface); transform: translateX(-1px); }
.totals { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.totals div { display: flex; flex-direction: column; min-width: 0; }
.totals div:nth-child(2) { text-align: center; } .totals div:last-child { text-align: right; }
.totals .v { font-family: var(--mono); font-size: 15px; }
.totals .t { font-size: 12px; color: var(--muted); }
.vj { color: var(--jan); } .vm { color: var(--mil); }
.calc { font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 12px; }
.settle { display: flex; flex-direction: column; gap: 10px; }
.btn { min-height: 48px; border-radius: 12px; border: 0; padding: 0 18px; font-weight: 600; font-size: 16px; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.danger { background: transparent; border: 1px solid var(--line); color: var(--mil); }
.btn:disabled { opacity: .5; cursor: default; }
.row2 { display: flex; gap: 10px; } .row2 .btn { flex: 1; }
.stamp { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; border: 2px solid var(--accent); color: var(--accent); border-radius: 8px; padding: 4px 10px; font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 14px; transform: rotate(-2deg); }
.linkbtn { border: 0; background: none; color: var(--muted); text-decoration: underline; min-height: 44px; padding: 0; font-size: 14px; align-self: flex-start; }

/* Abschnitte */
section h2 { font-family: var(--display); font-weight: 600; font-size: 20px; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
section h2 small { font-family: var(--body); font-weight: 500; font-size: 13px; color: var(--muted); }
.cats { display: flex; flex-direction: column; gap: 10px; }
.cat { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; }
.cat .n { font-size: 15px; }
.cat .a { font-family: var(--mono); font-size: 14px; text-align: right; }
.cat .a small { color: var(--muted); font-family: var(--body); font-size: 12px; margin-left: 6px; }
.cat .b { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.cat .b i { display: block; height: 100%; background: var(--bar); border-radius: 3px; }

.filter { display: inline-grid; grid-template-columns: repeat(3, auto); background: var(--line); border-radius: 10px; padding: 2px; gap: 2px; }
.filter button { border: 0; background: transparent; border-radius: 8px; min-height: 32px; padding: 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
.filter button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }
.day { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 14px 0 4px; border-bottom: 1px solid var(--line); }
.day:first-child { padding-top: 4px; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { border-bottom: 1px solid var(--line); }
.entry { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 6px 2px; background: none; border: 0; text-align: left; }
.entry:disabled { cursor: default; }
.entry .lbl { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.entry .lbl small { display: block; color: var(--muted); font-size: 12px; }
.entry .amt { font-family: var(--mono); font-size: 15px; white-space: nowrap; }
.entry.pay .lbl > span, .entry.pay .amt { color: var(--muted); font-style: italic; }
.state { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.state.open { background: var(--line); }
.state.done { color: var(--accent); border: 1px solid var(--accent); }
.empty { color: var(--muted); font-size: 15px; padding: 14px 0; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
.foot button { border: 0; background: none; color: var(--muted); text-decoration: underline; min-height: 44px; padding: 0; font-size: 13px; }

/* Knopf unten */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: linear-gradient(to top, var(--bg) 70%, transparent);
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dock .btn { width: 100%; max-width: 520px; margin: 0 auto; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; font-size: 17px; box-shadow: 0 8px 20px -10px rgba(0,0,0,.4); }

/* Blatt */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.42); z-index: 20; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); border-radius: 20px 20px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); overflow-y: auto; overscroll-behavior: contain; }
.sheet h3 { font-family: var(--display); font-weight: 600; font-size: 22px; margin: 0; display: flex; justify-content: space-between; align-items: center; }
.sheet h3 button { border: 0; background: none; color: var(--muted); min-height: 44px; min-width: 44px; font-size: 15px; padding: 0; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 9px; min-height: 40px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field input[type=text], .field input[type=date], .field input:not([type]) { height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px; font-size: 17px; width: 100%; min-width: 0; }
.amountbox { position: relative; }
.amountbox input { font-family: var(--display); font-weight: 800; font-size: 34px !important; height: 64px !important; padding-right: 44px !important; text-align: right; }
.amountbox .eur { position: absolute; right: 14px; bottom: 32px; transform: translateY(50%); font-family: var(--display); font-size: 26px; color: var(--muted); pointer-events: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 0 12px; min-height: 36px; font-size: 14px; color: var(--muted); }
.chips button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.payer { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.payer button { min-height: 50px; border-radius: 12px; border: 1px solid var(--line); background: transparent; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
.payer button.j[aria-pressed="true"] { border-color: var(--jan); background: var(--jan-soft); color: var(--jan); }
.payer button.m[aria-pressed="true"] { border-color: var(--mil); background: var(--mil-soft); color: var(--mil); }
.check { display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.check small { display: block; color: var(--muted); font-size: 13px; }
.msg { font-size: 14px; color: var(--warn); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }

/* Login und Personenwahl */
.gate { min-height: calc(100vh - 140px); display: flex; flex-direction: column; justify-content: center; gap: 18px; max-width: 360px; margin: 0 auto; padding-top: 40px; }
.gate h1 { font-family: var(--display); font-weight: 800; font-size: 40px; line-height: 1; margin: 0; }
.gate p { margin: 0; color: var(--muted); }
.pwfield { height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; font-size: 17px; width: 100%; }
.whobtn { min-height: 72px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; gap: 14px; padding: 0 18px; font-size: 20px; font-weight: 600; }
.whobtn .dot { width: 40px; height: 40px; font-size: 17px; }

@media (prefers-reduced-motion: no-preference) {
  .sheet:not([hidden]) { animation: up .2s ease-out; }
  @keyframes up { from { transform: translateY(30px); opacity: .5; } to { transform: none; opacity: 1; } }
}
@media (max-width: 360px) { .verdict .big { font-size: 40px; } .monthnav h1 { font-size: 26px; } }
</style>
</head>
<body>

<!-- Anmeldung -->
<form class="gate" id="login" hidden autocomplete="on">
  <div class="brand"><span class="half">½</span>Haushaltskasse</div>
  <h1>Jan &amp; Milena</h1>
  <p id="loginText">Gemeinsame Ausgaben, halbe halbe.</p>
  <label class="field"><span class="label" id="pwLabel">Passwort</span><input type="password" id="pw" class="pwfield" autocomplete="current-password"></label>
  <label class="field" id="pw2Wrap" hidden><span class="label">Passwort wiederholen</span><input type="password" id="pw2" class="pwfield" autocomplete="new-password"></label>
  <button class="btn primary" type="submit" id="loginBtn">Anmelden</button>
  <div class="msg" id="loginMsg" hidden></div>
</form>

<!-- Wer bin ich -->
<div class="gate" id="who" hidden>
  <h1>Wer bist du?</h1>
  <p>Das Handy merkt es sich. Neue Ausgaben stehen dann automatisch auf deinem Namen.</p>
  <button class="whobtn" type="button" data-me="J"><span class="dot j">J</span>Jan</button>
  <button class="whobtn" type="button" data-me="M"><span class="dot m">M</span>Milena</button>
</div>

<!-- App -->
<div class="wrap" id="app" hidden>
  <div class="top">
    <div class="brand"><span class="half">½</span>Haushaltskasse</div>
    <button class="me" type="button" id="meBtn" aria-label="Person wechseln"></button>
  </div>

  <div class="monthnav">
    <button class="navbtn" id="prev" type="button" aria-label="Vorheriger Monat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 id="title"></h1>
    <button class="navbtn" id="next" type="button" aria-label="Nächster Monat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>

  <div class="banner" id="banner" hidden></div>
  <div class="bilanz" id="bilanz"></div>

  <section id="catSec" hidden>
    <h2>Wofür <small id="catTotal"></small></h2>
    <div class="cats" id="cats"></div>
  </section>

  <section>
    <h2>Buchungen
      <span class="filter" role="group" aria-label="Filter">
        <button type="button" data-filter="all" aria-pressed="true">Alle</button>
        <button type="button" data-filter="J" aria-pressed="false">Jan</button>
        <button type="button" data-filter="M" aria-pressed="false">Milena</button>
      </span>
    </h2>
    <div id="list"></div>
  </section>

  <section>
    <h2>Monate</h2>
    <ul class="list" id="hist"></ul>
  </section>

  <div class="foot"><span id="status"></span><button type="button" id="logout">Abmelden</button></div>
</div>

<div class="dock" id="dock" hidden>
  <button class="btn primary" type="button" id="addBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Ausgabe eintragen</button>
</div>

<!-- Blatt zum Eintragen und Ändern -->
<div class="scrim" id="scrim" hidden></div>
<form class="sheet" id="sheet" hidden autocomplete="off" novalidate>
  <h3><span id="sTitle">Neue Ausgabe</span><button type="button" id="sClose" aria-label="Schließen">Schließen</button></h3>
  <div class="seg" role="group" aria-label="Art">
    <button type="button" id="sExp" aria-pressed="true">Ausgabe</button>
    <button type="button" id="sPay" aria-pressed="false">Ausgleichszahlung</button>
  </div>
  <label class="field amountbox"><span class="label">Betrag</span><input id="sAmount" inputmode="decimal" placeholder="0,00" aria-label="Betrag in Euro"><span class="eur">€</span></label>
  <label class="field"><span class="label" id="sLabelHint">Wofür</span><input id="sLabel" maxlength="60" placeholder="z. B. Edeka" autocapitalize="sentences"></label>
  <div class="chips" id="sSuggest"></div>
  <div class="field" id="sCatField"><span class="label">Kategorie</span><div class="chips" id="sCats"></div></div>
  <div class="field"><span class="label" id="sPayerHint">Bezahlt von</span>
    <div class="payer">
      <button type="button" class="j" id="sJ" aria-pressed="true"><span class="dot j">J</span><span id="sJt">Jan</span></button>
      <button type="button" class="m" id="sM" aria-pressed="false"><span class="dot m">M</span><span id="sMt">Milena</span></button>
    </div>
  </div>
  <label class="field"><span class="label">Datum</span><input type="date" id="sDate"></label>
  <label class="check" id="sRecWrap"><input type="checkbox" id="sRec"><span>Jeden Monat wiederholen<small>Zum Beispiel Netflix oder Spotify. Kommt dann jeden Monat von selbst.</small></span></label>
  <label class="check" id="sRuleWrap" hidden><input type="checkbox" id="sRule" checked><span>Auch für die kommenden Monate übernehmen<small>Monatliche Ausgabe</small></span></label>
  <div class="msg" id="sMsg" hidden></div>
  <button class="btn primary" type="submit" id="sSave">Eintragen</button>
  <div class="row2" id="sEditBtns" hidden>
    <button class="btn danger" type="button" id="sDel">Löschen</button>
    <button class="btn ghost" type="button" id="sStop" hidden>Nicht mehr wiederholen</button>
  </div>
</form>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  const NAMES = { J: 'Jan', M: 'Milena' };
  const OTHER = { J: 'M', M: 'J' };
  const CATS = {
    lebensmittel: 'Lebensmittel', drogerie: 'Drogerie & Apotheke', essen: 'Essen & Trinken', haushalt: 'Haushalt & Garten',
    online: 'Online', abos: 'Abos & Verträge', freizeit: 'Freizeit & Ausflüge', sonstiges: 'Sonstiges'
  };
  const GUESS = [
    ['lebensmittel', /edeka|aldi|lidl|kaufland|rewe|netto|penny|norma|flink|einkauf|tegut|b(ä|ae)cker|metzger|getr(ä|ae)nke|markt|picnic|knuspr|gorillas/i],
    ['drogerie', /^dm\b|\bdm$|rossmann|m(ü|ue)ller|apotheke|drogerie/i],
    ['essen', /essen|restaurant|pizza|d(ö|oe)ner|sushi|lieferando|wolt|uber ?eats|caf(é|e)|\bbar\b|imbiss|burger|thai|inder|italiener|perser|krieg im topf|dondi|brunch|eis\b/i],
    ['haushalt', /dehner|obi|ikea|bauhaus|hornbach|toom|xxxl|depot|haushalt|garten|baumarkt|putz|reinigung|blumen/i],
    ['online', /amazon|zalando|otto|ebay|temu|online/i],
    ['abos', /netflix|spotify|disney|prime|dazn|\bsky\b|youtube|apple|\babo\b|strom|internet|handy|rundfunk|gez|versicherung|miete/i],
    ['freizeit', /kino|konzert|urlaub|hotel|ausflug|museum|ticket|bahn|tank|parken|geschenk/i]
  ];

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const eur = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });
  const fmt = c => eur.format(Math.round(c) / 100);
  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };

  // ---------- Datum ----------
  const localToday = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const addMonth = (m, n) => { const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo - 1 + n, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
  const lastDay = m => { const [y, mo] = m.split('-').map(Number); return m + '-' + String(new Date(y, mo, 0).getDate()).padStart(2, '0'); };
  const monthName = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo - 1, 1).toLocaleDateString('de-DE', { month: 'long' }); };
  const monthYear = m => monthName(m) + ' ' + m.slice(0, 4);
  const dayLabel = d => { const [y, mo, da] = d.split('-').map(Number); return new Date(y, mo - 1, da).toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'short' }); };
  const isMonth = m => /^\d{4}-(0[1-9]|1[0-2])$/.test(m);

  // ---------- Zustand ----------
  const state = {
    me: ['J', 'M'].includes(ls.get('kasse.me')) ? ls.get('kasse.me') : null,
    month: isMonth(location.hash.slice(1)) ? location.hash.slice(1) : localToday().slice(0, 7),
    data: null, filter: 'all', confirmSettle: false, sheet: null, error: ''
  };
  const today = () => state.data?.today || localToday();
  const curMonth = () => today().slice(0, 7);

  // ---------- API ----------
  class AuthError extends Error {}
  async function api(path, { method = 'GET', body } = {}) {
    let r;
    try {
      r = await fetch('/api' + path, { method, headers: body ? { 'content-type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin' });
    } catch { throw new Error('Keine Verbindung. Prüfe das Internet und versuch es noch einmal.'); }
    let d = {};
    try { d = await r.json(); } catch {}
    if (r.status === 401) throw new AuthError(d.message || 'Bitte anmelden.');
    if (!r.ok || d.ok === false) throw new Error(d.message || 'Fehler ' + r.status);
    return d;
  }

  let loading = 0;
  async function load() {
    const token = ++loading, m = state.month;
    try {
      const d = await api('/month/' + m);
      if (token !== loading) return;
      state.data = d; state.error = '';
      show('app'); render();
    } catch (e) {
      if (e instanceof AuthError) { showLogin(e.message); return; }
      state.error = e.message; render();
    }
  }

  // ---------- Ansichten ----------
  function show(view) {
    $('login').hidden = view !== 'login';
    $('who').hidden = view !== 'who';
    const app = view === 'app' && !!state.me;
    if (view === 'app' && !state.me) { $('who').hidden = false; }
    $('app').hidden = !app;
    $('dock').hidden = !app;
  }
  let setupMode = false;
  async function showLogin(msg) {
    show('login');
    let text = msg && msg !== 'Bitte anmelden.' && msg !== 'Bitte zuerst ein Passwort festlegen.' ? msg : '';
    try { const h = await (await fetch('/api/health')).json(); setupMode = !h.passwordSet; } catch {}
    $('pw2Wrap').hidden = !setupMode;
    $('pw').autocomplete = setupMode ? 'new-password' : 'current-password';
    $('pwLabel').textContent = setupMode ? 'Neues Passwort (mindestens 8 Zeichen)' : 'Passwort';
    $('loginText').textContent = setupMode ? 'Einmalig: Legt euer gemeinsames Passwort fest. Danach meldet ihr euch beide damit an.' : 'Gemeinsame Ausgaben, halbe halbe.';
    $('loginBtn').textContent = setupMode ? 'Passwort festlegen' : 'Anmelden';
    $('loginMsg').textContent = text; $('loginMsg').hidden = !text;
    setTimeout(() => $('pw').focus(), 50);
  }

  // Abrechnung: Ausgaben halbe halbe, Ausgleichszahlungen verrechnet. bal > 0: Milena schuldet Jan.
  function sums(list) {
    let J = 0, M = 0, pJ = 0, pM = 0;
    for (const e of list) {
      if (e.kind === 'payment') { if (e.payer === 'J') pJ += e.amount_cents; else pM += e.amount_cents; }
      else if (e.payer === 'J') J += e.amount_cents; else M += e.amount_cents;
    }
    return { J, M, pJ, pM, total: J + M, bal: Math.round((J - M) / 2 + pJ - pM) };
  }
  const balOf = r => Math.round((r.total_j - r.total_m) / 2 + r.pay_j - r.pay_m);

  // Satz aus Sicht der Person am Handy
  function debtLine(bal, me, done) {
    if (!bal) return 'Ihr seid quitt';
    const debtor = bal > 0 ? 'M' : 'J', creditor = OTHER[debtor];
    if (done) return debtor === me ? 'Du hast ' + NAMES[creditor] + ' gezahlt' : NAMES[debtor] + ' hat dir gezahlt';
    return debtor === me ? 'Du schuldest ' + NAMES[creditor] : NAMES[debtor] + ' schuldet dir';
  }
  const debtShort = (bal, me) => bal ? debtLine(bal, me) + ' ' + fmt(Math.abs(bal)) : 'quitt';

  function render() {
    const d = state.data, m = state.month, me = state.me;
    $('meBtn').innerHTML = '<span>' + esc(NAMES[me] || '') + '</span><span class="dot ' + (me || 'j').toLowerCase() + '">' + esc(me || '?') + '</span>';
    $('title').innerHTML = esc(monthName(m)) + ' <span>' + m.slice(0, 4) + '</span>';
    $('next').disabled = m >= curMonth();
    $('status').textContent = state.error || (d ? 'Stand ' + new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : 'Lade …');
    if (!d) return;

    const settled = d.settlement;
    const entries = d.entries;
    const r = sums(entries);

    // Hinweis auf offenen früheren Monat
    const settledSet = new Set(d.settlements.map(s => s.month));
    const open = d.months.filter(x => x.month < m && !settledSet.has(x.month) && x.n > 0).sort((a, b) => b.month.localeCompare(a.month))[0];
    if (open) {
      $('banner').hidden = false;
      $('banner').innerHTML = '<span>' + esc(monthName(open.month)) + ' ist noch offen: ' + esc(debtShort(balOf(open), me)) + '</span><button type="button" data-goto="' + open.month + '">Ansehen</button>';
    } else $('banner').hidden = true;

    // Bilanz
    let h = '';
    if (!entries.length) {
      h += '<div class="verdict"><div><span class="who">Noch keine Buchungen in ' + esc(monthName(m)) + '</span><span class="big num">' + fmt(0) + '</span></div></div>'
        + '<div class="calc">Tragt mit dem Knopf unten ein, was ihr für den gemeinsamen Haushalt bezahlt. Die Bilanz rechnet automatisch halbe halbe.</div>';
    } else {
      const amount = Math.abs(r.bal);
      h += '<div class="verdict"><div><span class="who">' + esc(debtLine(r.bal, me, !!settled)) + '</span><span class="big num">' + fmt(amount) + '</span></div>'
        + (amount && !settled ? '<button type="button" class="copy" data-act="copy" data-v="' + (amount / 100).toFixed(2).replace('.', ',') + '">Kopieren</button>' : '') + '</div>';
      const pj = r.total ? r.J / r.total * 100 : 50;
      h += '<div class="split" role="img" aria-label="Jan ' + Math.round(pj) + ' Prozent, Milena ' + (100 - Math.round(pj)) + ' Prozent der Ausgaben"><span class="sj" style="width:' + pj.toFixed(2) + '%"></span><span class="sm"></span><span class="mid"></span></div>'
        + '<div class="totals num"><div><span class="t">Jan</span><span class="v vj">' + fmt(r.J) + '</span></div>'
        + '<div><span class="t">je Person</span><span class="v">' + fmt(r.total / 2) + '</span></div>'
        + '<div><span class="t">Milena</span><span class="v vm">' + fmt(r.M) + '</span></div></div>';
      const parts = ['Gesamt ' + fmt(r.total)];
      if (r.J !== r.M) parts.push((r.J > r.M ? 'Jan' : 'Milena') + ' hat ' + fmt(Math.abs(r.J - r.M)) + ' mehr bezahlt, die Hälfte davon wird ausgeglichen');
      if (r.pM) parts.push('Milena hat schon ' + fmt(r.pM) + ' überwiesen');
      if (r.pJ) parts.push('Jan hat schon ' + fmt(r.pJ) + ' überwiesen');
      h += '<div class="calc num">' + esc(parts.join('. ')) + '.</div>';
      if (settled) {
        const when = new Date(settled.settled_at.replace(' ', 'T') + 'Z').toLocaleDateString('de-DE', { day: 'numeric', month: 'long' });
        h += '<div class="settle"><span class="stamp"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>Ausgeglichen am ' + esc(when) + '</span>'
          + '<button type="button" class="linkbtn" data-act="reopen">Monat wieder öffnen</button></div>';
      } else if (state.confirmSettle) {
        const debtor = r.bal > 0 ? 'M' : 'J';
        const q = r.bal ? NAMES[debtor] + ' hat ' + NAMES[OTHER[debtor]] + ' ' + fmt(amount) + ' gezahlt?' : monthName(m) + ' abschließen?';
        h += '<div class="settle"><div>' + esc(q) + ' <span class="muted">Danach ist ' + esc(monthName(m)) + ' abgeschlossen.</span></div>'
          + '<div class="row2"><button type="button" class="btn ghost" data-act="settle-no">Abbrechen</button><button type="button" class="btn primary" data-act="settle-yes">Ja, ausgeglichen</button></div></div>';
      } else if (m < curMonth() || r.total) {
        h += '<div class="settle"><button type="button" class="btn ' + (m < curMonth() ? 'primary' : 'ghost') + '" data-act="settle">' + esc(monthName(m)) + ' ausgleichen</button></div>';
      }
    }
    $('bilanz').innerHTML = h;

    // Kategorien
    const cats = {};
    for (const e of entries) if (e.kind === 'expense') cats[e.category] = (cats[e.category] || 0) + e.amount_cents;
    const catList = Object.entries(cats).sort((a, b) => b[1] - a[1]);
    $('catSec').hidden = !catList.length;
    if (catList.length) {
      const max = catList[0][1];
      $('catTotal').textContent = fmt(r.total);
      $('cats').innerHTML = catList.map(([k, v]) => '<div class="cat"><span class="n">' + esc(CATS[k] || 'Sonstiges') + '</span><span class="a num">' + fmt(v) + '<small>' + Math.round(v / r.total * 100) + ' %</small></span><span class="b"><i style="width:' + (v / max * 100).toFixed(1) + '%"></i></span></div>').join('');
    }

    // Buchungen nach Tagen
    document.querySelectorAll('[data-filter]').forEach(b => b.setAttribute('aria-pressed', b.dataset.filter === state.filter));
    const shown = entries.filter(e => state.filter === 'all' || e.payer === state.filter);
    if (!shown.length) {
      $('list').innerHTML = '<div class="empty">' + (entries.length ? 'Keine Buchungen von ' + esc(NAMES[state.filter]) + '.' : 'Noch nichts eingetragen.') + '</div>';
    } else {
      const days = [];
      for (const e of shown) { const last = days[days.length - 1]; if (last && last.date === e.date) last.items.push(e); else days.push({ date: e.date, items: [e] }); }
      $('list').innerHTML = days.map(g => {
        const sum = g.items.filter(e => e.kind === 'expense').reduce((s, e) => s + e.amount_cents, 0);
        return '<div class="day"><span>' + esc(dayLabel(g.date)) + '</span><span class="num">' + (sum ? fmt(sum) : '') + '</span></div><ul class="list">'
          + g.items.map(e => {
            const pay = e.kind === 'payment';
            const title = pay ? NAMES[e.payer] + ' an ' + NAMES[OTHER[e.payer]] : e.label;
            const sub = pay ? (e.label || 'Ausgleichszahlung') : (CATS[e.category] || 'Sonstiges') + (e.recurring_id ? ' · monatlich' : '');
            return '<li><button type="button" class="entry' + (pay ? ' pay' : '') + '" data-id="' + e.id + '"' + (settled ? ' disabled' : '') + '>'
              + '<span class="dot ' + e.payer.toLowerCase() + '">' + e.payer + '</span>'
              + '<span class="lbl"><span>' + esc(title) + '</span><small>' + esc(sub) + '</small></span>'
              + '<span class="amt num">' + fmt(e.amount_cents) + '</span></button></li>';
          }).join('') + '</ul>';
      }).join('');
    }

    // Monate
    const rows = d.months.map(x => ({ ...x, settled: settledSet.has(x.month) }));
    $('hist').innerHTML = rows.length ? rows.map(x => {
      const total = x.total_j + x.total_m, cur = x.month === m;
      return '<li><button type="button" class="entry" data-goto="' + x.month + '">'
        + '<span class="lbl"><span style="font-weight:' + (cur ? 700 : 500) + '">' + esc(monthYear(x.month)) + '</span><small>' + esc(debtShort(balOf(x), me)) + '</small></span>'
        + '<span class="amt num">' + fmt(total) + '</span>'
        + '<span class="state ' + (x.settled ? 'done' : 'open') + '">' + (x.settled ? 'ausgeglichen' : 'offen') + '</span></button></li>';
    }).join('') : '<li class="empty">Sobald etwas eingetragen ist, stehen hier die Monate.</li>';

    $('dock').hidden = $('app').hidden || !!settled;
  }

  // ---------- Toast ----------
  let toastT;
  function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2600); }

  // ---------- Navigation ----------
  function go(m) {
    if (m > curMonth()) return;
    state.month = m; state.confirmSettle = false; state.filter = 'all';
    history.replaceState(null, '', '#' + m);
    if (state.data) state.data = { ...state.data, entries: [], settlement: null };
    render(); load(); window.scrollTo({ top: 0 });
  }
  $('prev').onclick = () => go(addMonth(state.month, -1));
  $('next').onclick = () => go(addMonth(state.month, 1));
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (isMonth(h) && h !== state.month) go(h); });

  document.addEventListener('click', async ev => {
    const g = ev.target.closest('[data-goto]'); if (g) { go(g.dataset.goto); return; }
    const f = ev.target.closest('[data-filter]'); if (f) { state.filter = f.dataset.filter; render(); return; }
    const w = ev.target.closest('[data-me]');
    if (w) { state.me = w.dataset.me; ls.set('kasse.me', state.me); show('app'); render(); if (!state.data) load(); return; }
    const a = ev.target.closest('[data-act]');
    if (a) return act(a);
    const en = ev.target.closest('.entry[data-id]');
    if (en && !en.disabled) openSheet(state.data.entries.find(e => String(e.id) === en.dataset.id));
  });

  async function act(a) {
    const m = state.month;
    switch (a.dataset.act) {
      case 'copy':
        try { await navigator.clipboard.writeText(a.dataset.v); toast(a.dataset.v + ' € kopiert'); } catch { toast('Kopieren geht hier nicht: ' + a.dataset.v + ' €'); }
        break;
      case 'settle': state.confirmSettle = true; render(); break;
      case 'settle-no': state.confirmSettle = false; render(); break;
      case 'settle-yes':
        a.disabled = true;
        try { await api('/settle/' + m, { method: 'PUT', body: { by: state.me } }); state.confirmSettle = false; toast(monthName(m) + ' ist ausgeglichen'); await load(); }
        catch (e) { a.disabled = false; handleErr(e); }
        break;
      case 'reopen':
        try { await api('/settle/' + m, { method: 'DELETE' }); toast(monthName(m) + ' ist wieder offen'); await load(); }
        catch (e) { handleErr(e); }
        break;
    }
  }
  function handleErr(e) { if (e instanceof AuthError) showLogin(e.message); else toast(e.message); }

  $('meBtn').onclick = () => show('who');
  $('logout').onclick = async () => { try { await api('/logout', { method: 'POST' }); } catch {} state.data = null; showLogin(); };

  $('login').onsubmit = async ev => {
    ev.preventDefault();
    const pw = $('pw').value;
    const err = t => { $('loginMsg').textContent = t; $('loginMsg').hidden = false; };
    if (setupMode && pw.length < 8) return err('Das Passwort braucht mindestens 8 Zeichen.');
    if (setupMode && pw !== $('pw2').value) return err('Die beiden Passwörter sind nicht gleich.');
    $('loginBtn').disabled = true; $('loginMsg').hidden = true;
    try {
      await api(setupMode ? '/setup' : '/login', { method: 'POST', body: { password: pw } });
      $('pw').value = ''; $('pw2').value = '';
      if (setupMode) toast('Passwort festgelegt');
      setupMode = false;
      await load();
    } catch (e) {
      if (/schon ein Passwort/.test(e.message)) { await showLogin(); }
      err(e.message);
    }
    finally { $('loginBtn').disabled = false; }
  };

  // ---------- Blatt ----------
  function parseAmount(s) {
    s = String(s).replace(/[€\s]/g, '');
    if (!s) return NaN;
    if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
    if (!/^\d+(\.\d{0,2})?$/.test(s)) return NaN;
    const c = Math.round(parseFloat(s) * 100);
    return c > 0 && c < 10000000 ? c : NaN;
  }
  function guessCategory(label) {
    const l = label.trim().toLowerCase();
    if (!l) return null;
    const known = state.data?.labels.find(x => x.label.toLowerCase() === l);
    if (known && CATS[known.category]) return known.category;
    for (const [k, re] of GUESS) if (re.test(l)) return k;
    return null;
  }

  function openSheet(entry) {
    const s = state.sheet = entry
      ? { id: entry.id, kind: entry.kind, payer: entry.payer, category: entry.category === 'ausgleich' ? 'sonstiges' : entry.category, catTouched: true, recurring: entry.recurring_id, recurringEnd: entry.recurring_end, month: entry.date.slice(0, 7), confirmDel: false, confirmStop: false }
      : { id: null, kind: 'expense', payer: state.me || 'J', category: 'sonstiges', catTouched: false, recurring: null, confirmDel: false, confirmStop: false };
    $('sAmount').value = entry ? (entry.amount_cents / 100).toFixed(2).replace('.', ',') : '';
    $('sLabel').value = entry ? entry.label : '';
    const m = state.month;
    $('sDate').value = entry ? entry.date : (m === curMonth() ? today() : lastDay(m));
    $('sDate').max = today();
    $('sRec').checked = false; $('sRule').checked = true;
    $('sMsg').hidden = true;
    renderSheet();
    $('scrim').hidden = false; $('sheet').hidden = false; $('sheet').scrollTop = 0;
    if (!entry) setTimeout(() => $('sAmount').focus(), 60);
  }
  function closeSheet() { state.sheet = null; $('scrim').hidden = true; $('sheet').hidden = true; }

  function renderSheet() {
    const s = state.sheet; if (!s) return;
    const pay = s.kind === 'payment', edit = !!s.id;
    $('sTitle').textContent = edit ? 'Buchung ändern' : pay ? 'Neue Ausgleichszahlung' : 'Neue Ausgabe';
    $('sExp').setAttribute('aria-pressed', !pay); $('sPay').setAttribute('aria-pressed', pay);
    $('sExp').parentElement.hidden = edit && !!s.recurring;
    $('sLabelHint').textContent = pay ? 'Notiz' : 'Wofür';
    $('sLabel').placeholder = pay ? 'z. B. PayPal Oktober' : 'z. B. Edeka';
    $('sPayerHint').textContent = pay ? 'Wer hat überwiesen?' : 'Bezahlt von';
    $('sJt').textContent = pay ? 'Jan an Milena' : 'Jan';
    $('sMt').textContent = pay ? 'Milena an Jan' : 'Milena';
    $('sJ').setAttribute('aria-pressed', s.payer === 'J'); $('sM').setAttribute('aria-pressed', s.payer === 'M');
    $('sCatField').hidden = pay;
    $('sCats').innerHTML = Object.entries(CATS).map(([k, n]) => '<button type="button" data-cat="' + k + '" aria-pressed="' + (s.category === k) + '">' + esc(n) + '</button>').join('');
    // Vorschläge: häufige Stichwörter, passend zum Getippten
    const q = $('sLabel').value.trim().toLowerCase();
    const sug = pay ? [] : (state.data?.labels || []).filter(l => !q || (l.label.toLowerCase().startsWith(q) && l.label.toLowerCase() !== q)).slice(0, 8);
    $('sSuggest').innerHTML = sug.map(l => '<button type="button" data-sug="' + esc(l.label) + '">' + esc(l.label) + '</button>').join('');
    $('sSuggest').hidden = !sug.length;
    $('sRecWrap').hidden = pay || edit;
    $('sRuleWrap').hidden = !(edit && s.recurring);
    $('sSave').textContent = edit ? 'Speichern' : pay ? 'Zahlung eintragen' : 'Eintragen';
    $('sEditBtns').hidden = !edit;
    $('sDel').textContent = s.confirmDel ? 'Wirklich löschen' : 'Löschen';
    const canStop = edit && s.recurring && !s.recurringEnd;
    $('sStop').hidden = !canStop;
    $('sStop').textContent = s.confirmStop ? 'Ab ' + monthName(addMonth(s.month, 1)) + ' beenden' : 'Nicht mehr wiederholen';
  }
  const setMsg = t => { $('sMsg').textContent = t || ''; $('sMsg').hidden = !t; };

  $('addBtn').onclick = () => openSheet(null);
  $('sClose').onclick = closeSheet;
  $('scrim').onclick = closeSheet;
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && state.sheet) closeSheet(); });
  $('sExp').onclick = () => { state.sheet.kind = 'expense'; renderSheet(); };
  $('sPay').onclick = () => {
    const s = state.sheet; s.kind = 'payment';
    // Vorschlag: wer schuldet, überweist den offenen Betrag
    const bal = state.data ? sums(state.data.entries).bal : 0;
    if (!s.id && bal) { s.payer = bal > 0 ? 'M' : 'J'; if (!$('sAmount').value) $('sAmount').value = (Math.abs(bal) / 100).toFixed(2).replace('.', ','); }
    renderSheet();
  };
  $('sJ').onclick = () => { state.sheet.payer = 'J'; renderSheet(); };
  $('sM').onclick = () => { state.sheet.payer = 'M'; renderSheet(); };
  $('sLabel').addEventListener('input', () => {
    const s = state.sheet; if (!s) return;
    if (!s.catTouched) s.category = guessCategory($('sLabel').value) || 'sonstiges';
    renderSheet();
  });
  $('sheet').addEventListener('click', ev => {
    const c = ev.target.closest('[data-cat]');
    if (c) { state.sheet.category = c.dataset.cat; state.sheet.catTouched = true; renderSheet(); return; }
    const sg = ev.target.closest('[data-sug]');
    if (sg) {
      $('sLabel').value = sg.dataset.sug;
      if (!state.sheet.catTouched) state.sheet.category = guessCategory(sg.dataset.sug) || 'sonstiges';
      renderSheet();
      if (!$('sAmount').value) $('sAmount').focus();
    }
  });

  let saving = false;
  $('sheet').onsubmit = async ev => {
    ev.preventDefault();
    const s = state.sheet; if (!s || saving) return;
    const amount = parseAmount($('sAmount').value);
    const pay = s.kind === 'payment';
    const label = $('sLabel').value.trim() || (pay ? 'Ausgleichszahlung' : '');
    const date = $('sDate').value;
    if (!amount) { setMsg('Bitte einen Betrag eingeben, zum Beispiel 13,50.'); $('sAmount').focus(); return; }
    if (!label) { setMsg('Wofür war die Ausgabe? Ein Stichwort reicht.'); $('sLabel').focus(); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { setMsg('Bitte ein Datum wählen.'); return; }
    const body = { date, amount_cents: amount, label, category: s.category, payer: s.payer, kind: s.kind, by: state.me };
    saving = true; $('sSave').disabled = true; setMsg('');
    try {
      if (s.id) await api('/entries/' + s.id, { method: 'PUT', body: { ...body, applyToRule: !!s.recurring && $('sRule').checked } });
      else await api('/entries', { method: 'POST', body: { ...body, recurring: !pay && $('sRec').checked } });
      closeSheet();
      const target = date.slice(0, 7);
      toast(s.id ? 'Gespeichert' : fmt(amount) + ' eingetragen' + (target !== state.month ? ' in ' + monthName(target) : ''));
      await load();
    } catch (e) { if (e instanceof AuthError) { closeSheet(); showLogin(e.message); } else setMsg(e.message); }
    finally { saving = false; $('sSave').disabled = false; }
  };
  $('sDel').onclick = async () => {
    const s = state.sheet; if (!s?.id) return;
    if (!s.confirmDel) { s.confirmDel = true; renderSheet(); return; }
    try { await api('/entries/' + s.id, { method: 'DELETE' }); closeSheet(); toast('Gelöscht'); await load(); }
    catch (e) { setMsg(e.message); }
  };
  $('sStop').onclick = async () => {
    const s = state.sheet; if (!s?.recurring) return;
    if (!s.confirmStop) { s.confirmStop = true; renderSheet(); return; }
    try { await api('/recurring/' + s.recurring + '?month=' + s.month, { method: 'DELETE' }); closeSheet(); toast('Wiederholung beendet'); await load(); }
    catch (e) { setMsg(e.message); }
  };

  // ---------- Aktuell halten ----------
  // Alle 30 Sekunden und beim Zurückkehren in die App neu laden, damit ihr beide denselben Stand seht.
  setInterval(() => { if (document.visibilityState === 'visible' && !state.sheet && !$('app').hidden) load(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !state.sheet && !$('app').hidden) load(); });

  // Erst nach der Antwort des Servers zeigen: Anmeldung, Personenwahl oder App
  load();
})();
</script>
</body>
</html>
