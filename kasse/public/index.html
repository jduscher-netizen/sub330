<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haushaltskasse</title>
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kasse">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<style>
/* Aufbau nach iOS 26: Inhalte in ruhigen, gruppierten Listen auf grauem Grund.
   Glas nur für die Ebene darüber: Leiste unten, Kopf beim Scrollen, Blatt, Menü, Hinweise.
   Oben ein schwaches Licht in den Farben von Jan und Milena, gewichtet nach ihrem Anteil. */
:root {
  --bg: #F2F2F7;
  --cell: #FFFFFF;
  --label: #000000;
  --secondary: rgba(60, 60, 67, .60);
  --tertiary: rgba(60, 60, 67, .30);
  --sep: rgba(60, 60, 67, .17);
  --fill: rgba(120, 120, 128, .12);
  --fill-strong: rgba(120, 120, 128, .20);
  --press: rgba(0, 0, 0, .05);
  --thumb: #FFFFFF;
  --tint: #34C759;
  --tint-text: #248A3D;
  --on-tint: #FFFFFF;
  --jan: #007AFF;
  --mil: #FF2D55;
  --orange: #FF9500;
  --red: #FF3B30;
  --glass: rgba(255, 255, 255, .58);
  --glass-strong: rgba(250, 250, 252, .80);
  --glass-rim: rgba(255, 255, 255, .85);
  --glass-shadow: 0 12px 34px rgba(0, 0, 0, .12), 0 2px 6px rgba(0, 0, 0, .06);
  --sheen: linear-gradient(180deg, rgba(255, 255, 255, .55) 0%, rgba(255, 255, 255, 0) 52%);
  --glow: .22;
  --text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --rounded: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --ease: cubic-bezier(.32, .72, 0, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --cell: #1C1C1E; --label: #FFFFFF;
    --secondary: rgba(235, 235, 245, .60); --tertiary: rgba(235, 235, 245, .30); --sep: rgba(84, 84, 88, .55);
    --fill: rgba(118, 118, 128, .24); --fill-strong: rgba(118, 118, 128, .36); --press: rgba(255, 255, 255, .06); --thumb: #636366;
    --tint: #30D158; --tint-text: #30D158; --on-tint: #002A0E;
    --jan: #0A84FF; --mil: #FF375F; --orange: #FF9F0A; --red: #FF453A;
    --glass: rgba(44, 44, 48, .52); --glass-strong: rgba(36, 36, 40, .78); --glass-rim: rgba(255, 255, 255, .16);
    --glass-shadow: 0 12px 34px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
    --sheen: linear-gradient(180deg, rgba(255, 255, 255, .14) 0%, rgba(255, 255, 255, 0) 52%);
    --glow: .34;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--label);
  font-family: var(--text); font-size: 17px; line-height: 1.3; letter-spacing: -.01em;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--jan); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* Licht oben */
.ambient { position: fixed; inset: 0 0 auto 0; height: 70vh; pointer-events: none; z-index: 0;
  background:
    radial-gradient(60% 55% at 12% 0%, color-mix(in srgb, var(--jan) calc(var(--gj, .5) * var(--glow) * 100%), transparent), transparent 70%),
    radial-gradient(60% 55% at 88% 0%, color-mix(in srgb, var(--mil) calc(var(--gm, .5) * var(--glow) * 100%), transparent), transparent 70%); }

/* Glas */
.glass {
  background: var(--sheen), var(--glass);
  -webkit-backdrop-filter: blur(24px) saturate(190%); backdrop-filter: blur(24px) saturate(190%);
  box-shadow: var(--glass-shadow), inset 0 .5px 0 var(--glass-rim), inset 0 0 0 .5px color-mix(in srgb, var(--glass-rim) 50%, transparent);
}
.glass.tinted { background: var(--sheen), color-mix(in srgb, var(--tint) 92%, transparent); color: var(--on-tint); }
.press { transition: transform .35s var(--ease), filter .2s; }
.press:active { transform: scale(.94); filter: brightness(1.04); }

/* Kopf */
.topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 30; height: calc(56px + env(safe-area-inset-top, 0px));
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; pointer-events: none; }
.topbar::before { content: ""; position: absolute; inset: 0 0 -28px 0; z-index: -1; opacity: 0; transition: opacity .25s;
  background: linear-gradient(var(--bg), color-mix(in srgb, var(--bg) 0%, transparent));
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); }
.topbar.scrolled::before { opacity: 1; }
.topbar > * { pointer-events: auto; }
.compact { grid-column: 2; text-align: center; font-weight: 600; font-size: 17px; opacity: 0; transform: translateY(6px); transition: opacity .25s, transform .35s var(--ease); pointer-events: none; }
.topbar.scrolled .compact { opacity: 1; transform: none; }
.circle { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
#meBtn { grid-column: 3; }
.mono { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; font-family: var(--rounded); font-weight: 600; font-size: 14px; color: #fff; flex: none; }
.mono.j { background: linear-gradient(180deg, color-mix(in srgb, var(--jan) 80%, #fff), var(--jan)); }
.mono.m { background: linear-gradient(180deg, color-mix(in srgb, var(--mil) 80%, #fff), var(--mil)); }
.mono.pay { background: var(--fill-strong); color: var(--tint-text); }
.mono svg { width: 16px; height: 16px; }

/* Menü */
.menu { position: fixed; z-index: 40; top: calc(env(safe-area-inset-top, 0px) + 54px); right: max(16px, env(safe-area-inset-right, 0px));
  width: 240px; border-radius: 22px; padding: 6px; background: var(--sheen), var(--glass-strong); transform-origin: top right; }
.menu button { width: 100%; min-height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 14px; font-size: 17px; text-align: left; }
.menu button:active { background: var(--press); }
.menu .check { margin-left: auto; color: var(--tint-text); }
.menu hr { border: 0; height: .5px; background: var(--sep); margin: 4px 12px; }
.menu .danger { color: var(--red); }

/* Seite */
.page { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding-top: calc(env(safe-area-inset-top, 0px) + 50px); padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 22px; }
.large { padding: 0 4px; }
.large h1 { margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: .01em; }
.large h1 span { color: var(--secondary); font-weight: 600; }
.large p { margin: 2px 0 0; color: var(--secondary); font-size: 15px; }
.sec-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 0 4px; margin-bottom: 8px; }
.sec-h h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: .005em; }
.sec-h small { color: var(--secondary); font-size: 15px; }

.cell { background: var(--cell); border-radius: 26px; overflow: hidden; }
.row { width: 100%; min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 10px 16px; text-align: left; position: relative; transition: background .15s; }
button.row:active:not(:disabled) { background: var(--press); }
.row:disabled { cursor: default; }
.list .row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: 58px; height: .5px; background: var(--sep); }
.list.plain .row + .row::before { left: 16px; }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.row-main .t { overflow-wrap: anywhere; }
.row-main .s { color: var(--secondary); font-size: 13px; }
.row-amt { font-size: 17px; white-space: nowrap; }
.row.pay .row-amt { color: var(--tint-text); }
.chev { width: 8px; height: 14px; color: var(--tertiary); flex: none; }
.empty { padding: 22px 16px; color: var(--secondary); font-size: 15px; text-align: center; }

.banner { display: flex; align-items: center; gap: 12px; }
.banner .ic { width: 30px; height: 30px; border-radius: 8px; background: var(--orange); color: #fff; display: grid; place-items: center; flex: none; }
.banner .go { color: var(--tint-text); font-weight: 500; white-space: nowrap; }

/* Bilanz */
.hero { padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 14px; }
.hero-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 32px; }
.hero-top .who { color: var(--secondary); font-size: 15px; font-weight: 500; }
.amount { font-family: var(--rounded); font-weight: 700; font-size: 58px; line-height: 1; letter-spacing: -.02em; margin-top: -4px; }
.amount .c { font-size: 34px; color: var(--secondary); font-weight: 600; margin-left: 4px; }
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 999px; background: var(--fill); color: var(--tint-text); font-size: 15px; font-weight: 600; white-space: nowrap; }
.pill svg { width: 15px; height: 15px; }
.split { position: relative; height: 8px; border-radius: 4px; display: flex; gap: 2px; }
.split i { display: block; height: 100%; border-radius: 4px; }
.split .sj { background: var(--jan); } .split .sm { background: var(--mil); flex: 1; }
.split .mid { position: absolute; left: 50%; top: -4px; bottom: -4px; width: 2px; border-radius: 1px; background: var(--label); opacity: .55; transform: translateX(-1px); }
.legend { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; font-size: 13px; color: var(--secondary); }
.legend div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.legend div:nth-child(2) { text-align: center; } .legend div:last-child { text-align: right; }
.legend b { font-size: 17px; font-weight: 600; color: var(--label); }
.legend .lj b { color: var(--jan); } .legend .lm b { color: var(--mil); }
.note { margin: 0; font-size: 13px; color: var(--secondary); line-height: 1.4; }
.btn { min-height: 50px; border-radius: 999px; padding: 0 20px; font-size: 17px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.prominent { background: var(--tint); color: var(--on-tint); }
.btn.gray { background: var(--fill); color: var(--tint-text); }
.btn:disabled { opacity: .45; }
.btns { display: flex; gap: 10px; } .btns .btn { flex: 1; }
.seal { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 18px; background: color-mix(in srgb, var(--tint) 14%, transparent); color: var(--tint-text); font-weight: 600; font-size: 15px; }
.seal svg { width: 22px; height: 22px; flex: none; }
.seal button { margin-left: auto; color: var(--tint-text); font-weight: 400; font-size: 15px; min-height: 32px; }
.ask { font-size: 15px; } .ask span { color: var(--secondary); }

/* Kategorien */
.cat { flex-direction: column; align-items: stretch; gap: 8px; padding: 12px 16px; min-height: 0; }
.cat .top { display: flex; justify-content: space-between; gap: 12px; }
.cat .top small { color: var(--secondary); font-size: 13px; margin-left: 6px; }
.cat .bar { height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.cat .bar i { display: block; height: 100%; border-radius: 3px; background: var(--tertiary); }
.cat:first-child .bar i { background: var(--tint); }

/* Segmente */
.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 2px; border-radius: 999px; background: var(--fill); isolation: isolate; }
.seg .thumb { position: absolute; z-index: -1; top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px) / var(--n, 2)); border-radius: 999px; background: var(--thumb);
  box-shadow: 0 3px 8px rgba(0, 0, 0, .12), 0 3px 1px rgba(0, 0, 0, .04); transform: translateX(calc(var(--i, 0) * 100%)); transition: transform .4s var(--ease); }
.seg button { min-height: 32px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.seg button[aria-pressed="true"] { font-weight: 600; }
.seg.big button { min-height: 40px; font-size: 15px; }
.seg.payer button { min-height: 44px; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.seg.payer button .mono { width: 24px; height: 24px; font-size: 12px; }
.seg.payer button.j[aria-pressed="true"] { color: var(--jan); }
.seg.payer button.m[aria-pressed="true"] { color: var(--mil); }

.day-h { display: flex; justify-content: space-between; padding: 0 16px 6px; color: var(--secondary); font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: .02em; }
.days { display: flex; flex-direction: column; gap: 18px; }
.state { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; }
.state.done { color: var(--tint-text); } .state.open { color: var(--orange); }
.state svg { width: 14px; height: 14px; }
.mrow-r { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.foot { text-align: center; color: var(--secondary); font-size: 13px; padding-top: 4px; }

/* Leiste unten */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; pointer-events: none;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dock::before { content: ""; position: absolute; inset: -20px 0 0 0; z-index: -1;
  background: linear-gradient(color-mix(in srgb, var(--bg) 0%, transparent), color-mix(in srgb, var(--bg) 70%, transparent));
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  -webkit-mask-image: linear-gradient(transparent, #000 60%); mask-image: linear-gradient(transparent, #000 60%); }
.dock-in { max-width: 560px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.dock-in > * { pointer-events: auto; }
.stepper { display: flex; align-items: center; height: 52px; border-radius: 999px; padding: 0 4px; }
.stepper button { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
.stepper button:disabled { opacity: .3; }
.stepper button svg { width: 11px; height: 18px; }
.stepper span { min-width: 92px; text-align: center; font-weight: 600; font-size: 15px; }
.add { height: 52px; border-radius: 999px; padding: 0 22px 0 18px; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 17px; }
.add svg { width: 18px; height: 18px; }

/* Blatt */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .28); }
.sheet { position: fixed; z-index: 51; left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); bottom: max(8px, env(safe-area-inset-bottom, 0px));
  max-width: 560px; margin: 0 auto; border-radius: 34px; padding: 8px 16px 18px;
  max-height: calc(100% - 16px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow-y: auto; overscroll-behavior: contain;
  display: flex; flex-direction: column; gap: 14px; background: var(--sheen), var(--glass-strong); }
.sheet > * { flex-shrink: 0; }
.grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--tertiary); margin: 0 auto 2px; flex: none; }
.sheet-h { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; }
.sheet-h h3 { margin: 0; text-align: center; font-size: 17px; font-weight: 600; }
.sheet-h .circle { background: var(--fill); }
.sheet-h .circle svg { width: 13px; height: 13px; }
.amountwrap { display: flex; justify-content: center; align-items: baseline; gap: 4px; padding: 6px 0 2px; cursor: text; }
.amountwrap input { border: 0; background: transparent; outline: none; padding: 0; text-align: right; width: 3ch; max-width: 80vw;
  font-family: var(--rounded); font-weight: 700; font-size: 56px; line-height: 1.1; letter-spacing: -.02em; caret-color: var(--tint); }
.amountwrap input::placeholder { color: var(--tertiary); }
.amountwrap .c { font-family: var(--rounded); font-weight: 600; font-size: 34px; color: var(--secondary); }
.measure { position: absolute; visibility: hidden; white-space: pre; font-family: var(--rounded); font-weight: 700; font-size: 56px; letter-spacing: -.02em; }
.group { background: color-mix(in srgb, var(--cell) 88%, transparent); border-radius: 22px; overflow: hidden; }
.frow { min-height: 50px; display: flex; align-items: center; gap: 12px; padding: 6px 16px; position: relative; }
.frow + .frow::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--sep); }
.frow > span:first-child { flex: none; }
.frow small { display: block; color: var(--secondary); font-size: 13px; }
.frow .grow { flex: 1; }
.frow input[type=text], .frow input[type=password], .frow input:not([type]) { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 17px; text-align: right; padding: 8px 0; }
.frow input::placeholder { color: var(--tertiary); }
.frow input:focus-visible { outline: none; }
.frow:focus-within { background: color-mix(in srgb, var(--tint) 6%, transparent); }
.frow input[type=date] { margin-left: auto; border: 0; border-radius: 8px; background: var(--fill); padding: 6px 10px; min-height: 34px; font-size: 17px; color: var(--label); }
.glabel { color: var(--secondary); font-size: 13px; padding: 0 16px 6px; }
.chips { display: flex; gap: 8px; }
.chips.scroll { overflow-x: auto; scrollbar-width: none; margin: -2px -16px; padding: 2px 16px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; }
.chips button { min-height: 36px; padding: 0 14px; border-radius: 999px; background: var(--fill); font-size: 15px; white-space: nowrap; }
.chips button[aria-pressed="true"] { background: var(--tint); color: var(--on-tint); font-weight: 600; }
.switch { -webkit-appearance: none; appearance: none; margin: 0 0 0 auto; width: 51px; height: 31px; border-radius: 16px; background: var(--fill-strong); position: relative; flex: none; cursor: pointer; transition: background .25s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 14px; background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, .15), 0 1px 1px rgba(0, 0, 0, .16); transition: transform .35s var(--ease), width .2s; }
.switch:active::after { width: 33px; }
.switch:checked { background: var(--tint); }
.switch:checked::after { transform: translateX(20px); }
.switch:checked:active::after { transform: translateX(14px); }
.rbtn { width: 100%; min-height: 50px; font-size: 17px; position: relative; }
.rbtn + .rbtn::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--sep); }
.rbtn.danger { color: var(--red); } .rbtn.tintx { color: var(--tint-text); }
.rbtn:active { background: var(--press); }
.msg { color: var(--red); font-size: 15px; text-align: center; }

/* Hinweis oben */
.toast { position: fixed; z-index: 60; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 50%; transform: translateX(-50%);
  min-height: 44px; max-width: calc(100% - 32px); padding: 0 18px; border-radius: 999px; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; white-space: nowrap; }
.toast svg { width: 18px; height: 18px; color: var(--tint-text); flex: none; }

/* Anmeldung */
.gate { position: relative; z-index: 1; min-height: 100vh; max-width: 380px; margin: 0 auto; display: flex; flex-direction: column; justify-content: center; gap: 22px;
  padding: calc(env(safe-area-inset-top, 0px) + 32px) 0 calc(env(safe-area-inset-bottom, 0px) + 32px); }
.appicon { width: 76px; height: 76px; border-radius: 18px; display: grid; place-items: center; color: #fff; font-family: var(--rounded); font-weight: 700; font-size: 40px;
  background: linear-gradient(160deg, color-mix(in srgb, var(--tint) 75%, #fff), var(--tint) 55%, color-mix(in srgb, var(--tint) 80%, #000)); box-shadow: 0 10px 24px color-mix(in srgb, var(--tint) 40%, transparent), inset 0 1px 0 rgba(255, 255, 255, .5); }
.gate h1 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 700; }
.gate p { margin: 6px 0 0; color: var(--secondary); font-size: 17px; }
.gate .group { background: var(--cell); }
.gate .frow input { text-align: left; }
.gate .msg { text-align: left; padding: 0 4px; }
.whobtn { min-height: 76px; border-radius: 26px; display: flex; align-items: center; gap: 16px; padding: 0 20px; font-size: 20px; font-weight: 600; text-align: left; }
.whobtn .mono { width: 44px; height: 44px; font-size: 19px; }
.whobtn .chev { margin-left: auto; }

@media (prefers-reduced-motion: no-preference) {
  .sheet:not([hidden]) { animation: sheetIn .5s var(--ease); }
  .scrim:not([hidden]) { animation: fade .3s ease-out; }
  .menu:not([hidden]) { animation: pop .38s var(--ease); }
  .toast:not([hidden]) { animation: drop .5s var(--ease); }
  @keyframes sheetIn { from { transform: translateY(105%); } to { transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
  @keyframes drop { from { opacity: 0; transform: translate(-50%, -18px) scale(.9); } to { opacity: 1; transform: translateX(-50%); } }
}
@media (prefers-reduced-motion: reduce) { .press:active { transform: none; } * { transition: none !important; } }
@media (max-width: 360px) { .amount { font-size: 48px; } .stepper span { min-width: 76px; } .add { padding: 0 16px 0 14px; } }
</style>
</head>
<body>
<div class="ambient" id="ambient"></div>

<!-- Anmeldung -->
<form class="gate" id="login" hidden autocomplete="on">
  <div class="appicon">½</div>
  <div>
    <h1>Haushaltskasse</h1>
    <p id="loginText">Gemeinsame Ausgaben, halbe halbe.</p>
  </div>
  <div class="group">
    <label class="frow"><span class="grow"><input type="password" id="pw" autocomplete="current-password" placeholder="Passwort" aria-label="Passwort" style="width:100%"></span></label>
    <label class="frow" id="pw2Wrap" hidden><span class="grow"><input type="password" id="pw2" autocomplete="new-password" placeholder="Passwort wiederholen" aria-label="Passwort wiederholen" style="width:100%"></span></label>
  </div>
  <span id="pwLabel" hidden></span>
  <button class="btn prominent press" type="submit" id="loginBtn">Anmelden</button>
  <div class="msg" id="loginMsg" hidden></div>
</form>

<!-- Wer bin ich -->
<div class="gate" id="who" hidden>
  <div>
    <h1>Wer bist du?</h1>
    <p>Das iPhone merkt es sich. Neue Ausgaben stehen dann automatisch auf deinem Namen.</p>
  </div>
  <button class="whobtn glass press" type="button" data-me="J"><span class="mono j">J</span>Jan<svg class="chev" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5L6.5 7l-5 5.5"/></svg></button>
  <button class="whobtn glass press" type="button" data-me="M"><span class="mono m">M</span>Milena<svg class="chev" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5L6.5 7l-5 5.5"/></svg></button>
</div>

<!-- App -->
<header class="topbar" id="topbar" hidden>
  <span class="compact" id="compact"></span>
  <button class="circle glass press" type="button" id="meBtn" aria-label="Person und Abmelden" aria-haspopup="menu"></button>
</header>
<div class="menu glass" id="menu" role="menu" hidden>
  <button type="button" role="menuitem" data-me="J"><span class="mono j">J</span>Ich bin Jan<span class="check" id="chkJ"></span></button>
  <button type="button" role="menuitem" data-me="M"><span class="mono m">M</span>Ich bin Milena<span class="check" id="chkM"></span></button>
  <hr>
  <button type="button" role="menuitem" class="danger" id="logout">Abmelden</button>
</div>

<main class="page" id="app" hidden>
  <div class="large" id="large">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>

  <button type="button" class="cell row banner" id="banner" hidden></button>
  <div class="cell hero" id="bilanz"></div>

  <section id="catSec" hidden>
    <div class="sec-h"><h2>Wofür</h2><small id="catTotal" class="num"></small></div>
    <div class="cell" id="cats"></div>
  </section>

  <section>
    <div class="sec-h"><h2>Buchungen</h2>
      <div class="seg" id="filter" role="group" aria-label="Filter" style="--n:3">
        <span class="thumb"></span>
        <button type="button" data-filter="all" aria-pressed="true">Alle</button>
        <button type="button" data-filter="J" aria-pressed="false">Jan</button>
        <button type="button" data-filter="M" aria-pressed="false">Milena</button>
      </div>
    </div>
    <div id="list" class="days"></div>
  </section>

  <section>
    <div class="sec-h"><h2>Monate</h2></div>
    <div class="cell list plain" id="hist"></div>
  </section>

  <div class="foot" id="status"></div>
</main>

<nav class="dock" id="dock" hidden>
  <div class="dock-in">
    <div class="stepper glass">
      <button class="press" id="prev" type="button" aria-label="Vorheriger Monat"><svg viewBox="0 0 11 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2L2 9l7 7"/></svg></button>
      <span id="monthLabel"></span>
      <button class="press" id="next" type="button" aria-label="Nächster Monat"><svg viewBox="0 0 11 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l7 7-7 7"/></svg></button>
    </div>
    <button class="add glass tinted press" type="button" id="addBtn"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M9 2v14M2 9h14"/></svg>Ausgabe</button>
  </div>
</nav>

<!-- Blatt zum Eintragen und Ändern -->
<div class="scrim" id="scrim" hidden></div>
<form class="sheet glass" id="sheet" hidden autocomplete="off" novalidate>
  <div class="grabber"></div>
  <div class="sheet-h">
    <button type="button" class="circle press" id="sClose" aria-label="Schließen"><svg viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M1.5 1.5l10 10M11.5 1.5l-10 10"/></svg></button>
    <h3 id="sTitle">Neue Ausgabe</h3>
  </div>
  <div class="seg big" id="sKind" style="--n:2">
    <span class="thumb"></span>
    <button type="button" id="sExp" aria-pressed="true">Ausgabe</button>
    <button type="button" id="sPay" aria-pressed="false">Ausgleichszahlung</button>
  </div>
  <label class="amountwrap"><input id="sAmount" inputmode="decimal" placeholder="0,00" aria-label="Betrag in Euro" enterkeyhint="next"><span class="c">€</span></label>
  <span class="measure" id="measure" aria-hidden="true"></span>
  <div class="group">
    <label class="frow"><span id="sLabelHint">Wofür</span><input id="sLabel" maxlength="60" placeholder="z. B. Edeka" autocapitalize="sentences" enterkeyhint="done"></label>
  </div>
  <div class="chips scroll" id="sSuggest"></div>
  <div id="sCatField">
    <div class="glabel">Kategorie</div>
    <div class="chips wrap" id="sCats"></div>
  </div>
  <div>
    <div class="glabel" id="sPayerHint">Bezahlt von</div>
    <div class="seg payer" id="sPayer" style="--n:2">
      <span class="thumb"></span>
      <button type="button" class="j" id="sJ" aria-pressed="true"><span class="mono j">J</span><span id="sJt">Jan</span></button>
      <button type="button" class="m" id="sM" aria-pressed="false"><span class="mono m">M</span><span id="sMt">Milena</span></button>
    </div>
  </div>
  <div class="group">
    <label class="frow"><span>Datum</span><input type="date" id="sDate"></label>
    <label class="frow" id="sRecWrap"><span class="grow">Jeden Monat<small>Kommt dann von selbst, z. B. Netflix</small></span><input type="checkbox" class="switch" id="sRec"></label>
    <label class="frow" id="sRuleWrap" hidden><span class="grow">Auch künftige Monate<small>Monatliche Ausgabe mit ändern</small></span><input type="checkbox" class="switch" id="sRule" checked></label>
  </div>
  <div class="msg" id="sMsg" hidden></div>
  <button class="btn prominent press" type="submit" id="sSave">Eintragen</button>
  <div class="group" id="sEditBtns" hidden>
    <button class="rbtn tintx" type="button" id="sStop" hidden>Nicht mehr wiederholen</button>
    <button class="rbtn danger" type="button" id="sDel">Löschen</button>
  </div>
</form>

<div class="toast glass" id="toast" role="status" hidden></div>

<script>
(() => {
  const NAMES = { J: 'Jan', M: 'Milena' };
  const OTHER = { J: 'M', M: 'J' };
  const CATS = {
    lebensmittel: 'Lebensmittel', drogerie: 'Drogerie & Apotheke', essen: 'Essen & Trinken', haushalt: 'Haushalt & Garten',
    online: 'Online', abos: 'Abos & Verträge', freizeit: 'Freizeit & Ausflüge', sonstiges: 'Sonstiges'
  };
  const GUESS = [
    ['lebensmittel', /edeka|aldi|lidl|kaufland|rewe|netto|penny|norma|flink|einkauf|tegut|b(ä|ae)cker|metzger|getr(ä|ae)nke|markt|picnic|knuspr|gorillas/i],
    ['drogerie', /^dm\b|\bdm$|rossmann|m(ü|ue)ller|apotheke|drogerie/i],
    ['essen', /essen|restaurant|pizza|d(ö|oe)ner|sushi|lieferando|wolt|uber ?eats|caf(é|e)|\bbar\b|imbiss|burger|thai|inder|italiener|perser|krieg im topf|dondi|brunch|eis\b/i],
    ['haushalt', /dehner|obi|ikea|bauhaus|hornbach|toom|xxxl|depot|haushalt|garten|baumarkt|putz|reinigung|blumen/i],
    ['online', /amazon|zalando|otto|ebay|temu|online/i],
    ['abos', /netflix|spotify|disney|prime|dazn|\bsky\b|youtube|apple|\babo\b|strom|internet|handy|rundfunk|gez|versicherung|miete/i],
    ['freizeit', /kino|konzert|urlaub|hotel|ausflug|museum|ticket|bahn|tank|parken|geschenk/i]
  ];
  const ICON = {
    chev: '<svg class="chev" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5L6.5 7l-5 5.5"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    checkCircle: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="11"/><path d="M7 12.4l3.3 3.3L17.2 8.8" fill="none" stroke="var(--cell)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    clock: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>',
    swap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h15l-4-4M20 16H5l4 4"/></svg>',
    dot: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/></svg>'
  };

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const eur = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });
  const fmt = c => eur.format(Math.round(c) / 100);
  const fmtNum = c => (Math.round(c) / 100).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };

  // ---------- Datum ----------
  const localToday = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const addMonth = (m, n) => { const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo - 1 + n, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
  const lastDay = m => { const [y, mo] = m.split('-').map(Number); return m + '-' + String(new Date(y, mo, 0).getDate()).padStart(2, '0'); };
  const monthName = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo - 1, 1).toLocaleDateString('de-DE', { month: 'long' }); };
  const monthYear = m => monthName(m) + ' ' + m.slice(0, 4);
  const dayLabel = d => { const [y, mo, da] = d.split('-').map(Number); return new Date(y, mo - 1, da).toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' }); };
  const isMonth = m => /^\d{4}-(0[1-9]|1[0-2])$/.test(m);

  // ---------- Zustand ----------
  const state = {
    me: ['J', 'M'].includes(ls.get('kasse.me')) ? ls.get('kasse.me') : null,
    month: isMonth(location.hash.slice(1)) ? location.hash.slice(1) : localToday().slice(0, 7),
    data: null, filter: 'all', confirmSettle: false, sheet: null, error: ''
  };
  const today = () => state.data?.today || localToday();
  const curMonth = () => today().slice(0, 7);

  // ---------- API ----------
  class AuthError extends Error {}
  async function api(path, { method = 'GET', body } = {}) {
    let r;
    try {
      r = await fetch('/api' + path, { method, headers: body ? { 'content-type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin' });
    } catch { throw new Error('Keine Verbindung. Prüfe das Internet und versuch es noch einmal.'); }
    let d = {};
    try { d = await r.json(); } catch {}
    if (r.status === 401) throw new AuthError(d.message || 'Bitte anmelden.');
    if (!r.ok || d.ok === false) throw new Error(d.message || 'Fehler ' + r.status);
    return d;
  }

  let loading = 0;
  async function load() {
    const token = ++loading;
    try {
      const d = await api('/month/' + state.month);
      if (token !== loading) return;
      state.data = d; state.error = '';
      show('app'); render();
    } catch (e) {
      if (e instanceof AuthError) { showLogin(e.message); return; }
      state.error = e.message; render();
    }
  }

  // ---------- Ansichten ----------
  function show(view) {
    const app = view === 'app' && !!state.me;
    $('login').hidden = view !== 'login';
    $('who').hidden = !(view === 'who' || (view === 'app' && !state.me));
    $('app').hidden = !app; $('dock').hidden = !app; $('topbar').hidden = !app;
    $('menu').hidden = true;
  }
  let setupMode = false;
  async function showLogin(msg) {
    show('login');
    const text = msg && msg !== 'Bitte anmelden.' && msg !== 'Bitte zuerst ein Passwort festlegen.' ? msg : '';
    try { const h = await (await fetch('/api/health')).json(); setupMode = !h.passwordSet; } catch {}
    $('pw2Wrap').hidden = !setupMode;
    $('pw').autocomplete = setupMode ? 'new-password' : 'current-password';
    $('pw').placeholder = setupMode ? 'Neues Passwort, mindestens 8 Zeichen' : 'Passwort';
    $('loginText').textContent = setupMode ? 'Legt einmalig euer gemeinsames Passwort fest. Danach meldet ihr euch beide damit an.' : 'Gemeinsame Ausgaben, halbe halbe.';
    $('loginBtn').textContent = setupMode ? 'Passwort festlegen' : 'Anmelden';
    $('loginMsg').textContent = text; $('loginMsg').hidden = !text;
    setTimeout(() => $('pw').focus(), 50);
  }

  // Abrechnung: Ausgaben halbe halbe, Ausgleichszahlungen verrechnet. bal > 0: Milena schuldet Jan.
  function sums(list) {
    let J = 0, M = 0, pJ = 0, pM = 0;
    for (const e of list) {
      if (e.kind === 'payment') { if (e.payer === 'J') pJ += e.amount_cents; else pM += e.amount_cents; }
      else if (e.payer === 'J') J += e.amount_cents; else M += e.amount_cents;
    }
    return { J, M, pJ, pM, total: J + M, bal: Math.round((J - M) / 2 + pJ - pM) };
  }
  const balOf = r => Math.round((r.total_j - r.total_m) / 2 + r.pay_j - r.pay_m);

  // Satz aus Sicht der Person am Handy
  function debtLine(bal, me, done) {
    if (!bal) return 'Ihr seid quitt';
    const debtor = bal > 0 ? 'M' : 'J', creditor = OTHER[debtor];
    if (done) return debtor === me ? 'Du hast ' + NAMES[creditor] + ' gezahlt' : NAMES[debtor] + ' hat dir gezahlt';
    return debtor === me ? 'Du schuldest ' + NAMES[creditor] : NAMES[debtor] + ' schuldet dir';
  }
  const debtShort = (bal, me) => bal ? debtLine(bal, me) + ' ' + fmt(Math.abs(bal)) : 'Quitt';

  function setSeg(el, i) { el.style.setProperty('--i', i); }

  function render() {
    const d = state.data, m = state.month, me = state.me;
    $('meBtn').innerHTML = '<span class="mono ' + (me || 'j').toLowerCase() + '">' + esc(me || '?') + '</span>';
    $('chkJ').innerHTML = me === 'J' ? ICON.check : ''; $('chkM').innerHTML = me === 'M' ? ICON.check : '';
    $('chkJ').style.width = $('chkM').style.width = '18px';
    $('title').innerHTML = esc(monthName(m)) + ' <span>' + m.slice(0, 4) + '</span>';
    $('compact').textContent = monthYear(m);
    $('monthLabel').textContent = monthName(m);
    $('next').disabled = m >= curMonth();
    $('status').textContent = state.error || (d ? 'Aktualisiert um ' + new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : 'Lade …');
    if (!d) return;

    const settled = d.settlement;
    const entries = d.entries;
    const r = sums(entries);
    const n = entries.filter(e => e.kind === 'expense').length;
    $('subtitle').textContent = n ? n + (n === 1 ? ' Ausgabe' : ' Ausgaben') + ' · ' + fmt(r.total) : 'Noch keine Ausgaben';

    // Licht oben nach Anteil
    const shareJ = r.total ? r.J / r.total : .5;
    $('ambient').style.setProperty('--gj', (.25 + shareJ * .75).toFixed(2));
    $('ambient').style.setProperty('--gm', (.25 + (1 - shareJ) * .75).toFixed(2));

    // Hinweis auf offenen früheren Monat
    const settledSet = new Set(d.settlements.map(s => s.month));
    const open = d.months.filter(x => x.month < m && !settledSet.has(x.month) && x.n > 0).sort((a, b) => b.month.localeCompare(a.month))[0];
    if (open) {
      $('banner').hidden = false; $('banner').dataset.goto = open.month;
      $('banner').innerHTML = '<span class="ic">' + ICON.clock + '</span><span class="row-main"><span class="t">' + esc(monthName(open.month)) + ' ist noch offen</span><span class="s">' + esc(debtShort(balOf(open), me)) + '</span></span><span class="go">Ansehen</span>';
    } else $('banner').hidden = true;

    // Bilanz
    let h = '';
    if (!entries.length) {
      h += '<div class="hero-top"><span class="who">Noch nichts eingetragen</span></div><div class="amount num">0,00<span class="c">€</span></div>'
        + '<p class="note">Tippt unten auf Ausgabe und tragt ein, was ihr für den gemeinsamen Haushalt bezahlt. Die Kasse rechnet halbe halbe.</p>';
    } else {
      const amount = Math.abs(r.bal);
      h += '<div class="hero-top"><span class="who">' + esc(debtLine(r.bal, me, !!settled)) + '</span>'
        + (amount && !settled ? '<button type="button" class="pill press" data-act="copy" data-v="' + fmtNum(amount) + '">' + ICON.copy + 'Kopieren</button>' : '') + '</div>'
        + '<div class="amount num">' + fmtNum(amount) + '<span class="c">€</span></div>';
      const pj = r.total ? r.J / r.total * 100 : 50;
      h += '<div class="split" role="img" aria-label="Jan ' + Math.round(pj) + ' Prozent, Milena ' + (100 - Math.round(pj)) + ' Prozent der Ausgaben">'
        + (r.J ? '<i class="sj" style="width:' + pj.toFixed(2) + '%"></i>' : '') + (r.M ? '<i class="sm"></i>' : '') + '<span class="mid"></span></div>'
        + '<div class="legend num"><div class="lj">Jan<b>' + fmt(r.J) + '</b></div><div>je Person<b>' + fmt(r.total / 2) + '</b></div><div class="lm">Milena<b>' + fmt(r.M) + '</b></div></div>';
      const parts = [];
      if (r.J !== r.M) parts.push((r.J > r.M ? 'Jan' : 'Milena') + ' hat ' + fmt(Math.abs(r.J - r.M)) + ' mehr bezahlt, die Hälfte davon wird ausgeglichen');
      if (r.pM) parts.push('Milena hat schon ' + fmt(r.pM) + ' überwiesen');
      if (r.pJ) parts.push('Jan hat schon ' + fmt(r.pJ) + ' überwiesen');
      if (parts.length) h += '<p class="note num">' + esc(parts.join('. ')) + '.</p>';
      if (settled) {
        const when = new Date(settled.settled_at.replace(' ', 'T') + 'Z').toLocaleDateString('de-DE', { day: 'numeric', month: 'long' });
        h += '<div class="seal">' + ICON.checkCircle + '<span>Ausgeglichen am ' + esc(when) + '</span><button type="button" data-act="reopen">Öffnen</button></div>';
      } else if (state.confirmSettle) {
        const debtor = r.bal > 0 ? 'M' : 'J';
        const q = r.bal ? NAMES[debtor] + ' hat ' + NAMES[OTHER[debtor]] + ' ' + fmt(amount) + ' gezahlt?' : monthName(m) + ' abschließen?';
        h += '<div class="ask">' + esc(q) + ' <span>Danach ist ' + esc(monthName(m)) + ' abgeschlossen.</span></div>'
          + '<div class="btns"><button type="button" class="btn gray press" data-act="settle-no">Abbrechen</button><button type="button" class="btn prominent press" data-act="settle-yes">Ja, ausgeglichen</button></div>';
      } else if (m < curMonth() || r.total) {
        h += '<button type="button" class="btn ' + (m < curMonth() ? 'prominent' : 'gray') + ' press" data-act="settle">' + esc(monthName(m)) + ' ausgleichen</button>';
      }
    }
    $('bilanz').innerHTML = h;

    // Kategorien
    const cats = {};
    for (const e of entries) if (e.kind === 'expense') cats[e.category] = (cats[e.category] || 0) + e.amount_cents;
    const catList = Object.entries(cats).sort((a, b) => b[1] - a[1]);
    $('catSec').hidden = !catList.length;
    if (catList.length) {
      const max = catList[0][1];
      $('catTotal').textContent = fmt(r.total);
      $('cats').className = 'cell list plain';
      $('cats').innerHTML = catList.map(([k, v]) => '<div class="row cat"><div class="top"><span>' + esc(CATS[k] || 'Sonstiges') + '</span><span class="num">' + fmt(v) + '<small>' + Math.round(v / r.total * 100) + ' %</small></span></div><div class="bar"><i style="width:' + (v / max * 100).toFixed(1) + '%"></i></div></div>').join('');
    }

    // Buchungen nach Tagen
    const fi = ['all', 'J', 'M'].indexOf(state.filter);
    setSeg($('filter'), fi);
    document.querySelectorAll('[data-filter]').forEach(b => b.setAttribute('aria-pressed', b.dataset.filter === state.filter));
    const shown = entries.filter(e => state.filter === 'all' || e.payer === state.filter);
    if (!shown.length) {
      $('list').innerHTML = '<div class="cell empty">' + (entries.length ? 'Keine Buchungen von ' + esc(NAMES[state.filter]) + '.' : 'Noch nichts eingetragen.') + '</div>';
    } else {
      const days = [];
      for (const e of shown) { const last = days[days.length - 1]; if (last && last.date === e.date) last.items.push(e); else days.push({ date: e.date, items: [e] }); }
      $('list').innerHTML = days.map(g => {
        const sum = g.items.filter(e => e.kind === 'expense').reduce((s, e) => s + e.amount_cents, 0);
        return '<div><div class="day-h"><span>' + esc(dayLabel(g.date)) + '</span><span class="num">' + (sum ? fmt(sum) : '') + '</span></div><div class="cell list">'
          + g.items.map(e => {
            const pay = e.kind === 'payment';
            const title = pay ? NAMES[e.payer] + ' an ' + NAMES[OTHER[e.payer]] : e.label;
            const sub = pay ? (e.label || 'Ausgleichszahlung') : (CATS[e.category] || 'Sonstiges') + (e.recurring_id ? ' · monatlich' : '');
            const avatar = pay ? '<span class="mono pay">' + ICON.swap + '</span>' : '<span class="mono ' + e.payer.toLowerCase() + '">' + e.payer + '</span>';
            return '<button type="button" class="row entry' + (pay ? ' pay' : '') + '" data-id="' + e.id + '"' + (settled ? ' disabled' : '') + '>' + avatar
              + '<span class="row-main"><span class="t">' + esc(title) + '</span><span class="s">' + esc(sub) + '</span></span>'
              + '<span class="row-amt num">' + fmt(e.amount_cents) + '</span></button>';
          }).join('') + '</div></div>';
      }).join('');
    }

    // Monate
    $('hist').innerHTML = d.months.length ? d.months.map(x => {
      const s = settledSet.has(x.month);
      return '<button type="button" class="row" data-goto="' + x.month + '"' + (x.month === m ? ' aria-current="true"' : '') + '>'
        + '<span class="row-main"><span class="t" style="font-weight:' + (x.month === m ? 600 : 400) + '">' + esc(monthYear(x.month)) + '</span><span class="s">' + esc(debtShort(balOf(x), me)) + '</span></span>'
        + '<span class="mrow-r"><span class="num">' + fmt(x.total_j + x.total_m) + '</span><span class="state ' + (s ? 'done' : 'open') + '">' + (s ? ICON.check + 'Ausgeglichen' : 'Offen') + '</span></span>' + ICON.chev + '</button>';
    }).join('') : '<div class="empty">Sobald etwas eingetragen ist, stehen hier die Monate.</div>';

    $('addBtn').hidden = !!settled;
  }

  // ---------- Hinweis ----------
  let toastT;
  function toast(t, ok = true) {
    const el = $('toast'); el.innerHTML = (ok ? ICON.checkCircle : '') + '<span>' + esc(t) + '</span>';
    el.hidden = true; void el.offsetWidth; el.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2400);
  }

  // ---------- Kopf beim Scrollen ----------
  new IntersectionObserver(([e]) => $('topbar').classList.toggle('scrolled', !e.isIntersecting), { rootMargin: '-60px 0px 0px 0px' }).observe($('large'));

  // ---------- Navigation ----------
  function go(m) {
    if (m > curMonth()) return;
    state.month = m; state.confirmSettle = false; state.filter = 'all';
    history.replaceState(null, '', '#' + m);
    if (state.data) state.data = { ...state.data, entries: [], settlement: null };
    render(); load(); window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  $('prev').onclick = () => go(addMonth(state.month, -1));
  $('next').onclick = () => go(addMonth(state.month, 1));
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (isMonth(h) && h !== state.month) go(h); });

  document.addEventListener('click', async ev => {
    if (!$('menu').hidden && !ev.target.closest('#menu, #meBtn')) { $('menu').hidden = true; return; }
    const g = ev.target.closest('[data-goto]'); if (g) { go(g.dataset.goto); return; }
    const f = ev.target.closest('[data-filter]'); if (f) { state.filter = f.dataset.filter; render(); return; }
    const w = ev.target.closest('[data-me]');
    if (w) { state.me = w.dataset.me; ls.set('kasse.me', state.me); show('app'); render(); if (!state.data) load(); return; }
    const a = ev.target.closest('[data-act]');
    if (a) return act(a);
    const en = ev.target.closest('.entry[data-id]');
    if (en && !en.disabled) openSheet(state.data.entries.find(e => String(e.id) === en.dataset.id));
  });

  async function act(a) {
    const m = state.month;
    switch (a.dataset.act) {
      case 'copy':
        try { await navigator.clipboard.writeText(a.dataset.v); toast(a.dataset.v + ' € kopiert'); } catch { toast('Betrag: ' + a.dataset.v + ' €', false); }
        break;
      case 'settle': state.confirmSettle = true; render(); break;
      case 'settle-no': state.confirmSettle = false; render(); break;
      case 'settle-yes':
        a.disabled = true;
        try { await api('/settle/' + m, { method: 'PUT', body: { by: state.me } }); state.confirmSettle = false; toast(monthName(m) + ' ist ausgeglichen'); await load(); }
        catch (e) { a.disabled = false; handleErr(e); }
        break;
      case 'reopen':
        try { await api('/settle/' + m, { method: 'DELETE' }); toast(monthName(m) + ' ist wieder offen'); await load(); }
        catch (e) { handleErr(e); }
        break;
    }
  }
  function handleErr(e) { if (e instanceof AuthError) showLogin(e.message); else toast(e.message, false); }

  $('meBtn').onclick = () => { $('menu').hidden = !$('menu').hidden; };
  $('logout').onclick = async () => { $('menu').hidden = true; try { await api('/logout', { method: 'POST' }); } catch {} state.data = null; showLogin(); };

  $('login').onsubmit = async ev => {
    ev.preventDefault();
    const pw = $('pw').value;
    const err = t => { $('loginMsg').textContent = t; $('loginMsg').hidden = false; };
    if (setupMode && pw.length < 8) return err('Das Passwort braucht mindestens 8 Zeichen.');
    if (setupMode && pw !== $('pw2').value) return err('Die beiden Passwörter sind nicht gleich.');
    $('loginBtn').disabled = true; $('loginMsg').hidden = true;
    try {
      await api(setupMode ? '/setup' : '/login', { method: 'POST', body: { password: pw } });
      $('pw').value = ''; $('pw2').value = '';
      if (setupMode) toast('Passwort festgelegt');
      setupMode = false;
      await load();
    } catch (e) {
      if (/schon ein Passwort/.test(e.message)) await showLogin();
      err(e.message);
    } finally { $('loginBtn').disabled = false; }
  };

  // ---------- Blatt ----------
  function parseAmount(s) {
    s = String(s).replace(/[€\s]/g, '');
    if (!s) return NaN;
    if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
    if (!/^\d+(\.\d{0,2})?$/.test(s)) return NaN;
    const c = Math.round(parseFloat(s) * 100);
    return c > 0 && c < 10000000 ? c : NaN;
  }
  function guessCategory(label) {
    const l = label.trim().toLowerCase();
    if (!l) return null;
    const known = state.data?.labels.find(x => x.label.toLowerCase() === l);
    if (known && CATS[known.category]) return known.category;
    for (const [k, re] of GUESS) if (re.test(l)) return k;
    return null;
  }
  // Betragsfeld wächst mit der Eingabe, damit Zahl und € mittig zusammenstehen
  function sizeAmount() {
    const v = $('sAmount').value || $('sAmount').placeholder;
    $('measure').textContent = v;
    $('sAmount').style.width = Math.ceil($('measure').getBoundingClientRect().width + 6) + 'px';
  }
  $('sAmount').addEventListener('input', sizeAmount);

  function openSheet(entry) {
    state.sheet = entry
      ? { id: entry.id, kind: entry.kind, payer: entry.payer, category: entry.category === 'ausgleich' ? 'sonstiges' : entry.category, catTouched: true, recurring: entry.recurring_id, recurringEnd: entry.recurring_end, month: entry.date.slice(0, 7), confirmDel: false, confirmStop: false }
      : { id: null, kind: 'expense', payer: state.me || 'J', category: 'sonstiges', catTouched: false, recurring: null, confirmDel: false, confirmStop: false };
    $('sAmount').value = entry ? fmtNum(entry.amount_cents) : '';
    $('sLabel').value = entry ? entry.label : '';
    const m = state.month;
    $('sDate').value = entry ? entry.date : (m === curMonth() ? today() : lastDay(m));
    $('sDate').max = today();
    $('sRec').checked = false; $('sRule').checked = true;
    $('sMsg').hidden = true;
    renderSheet();
    $('scrim').hidden = false; $('sheet').hidden = false; $('sheet').scrollTop = 0;
    sizeAmount();
    if (!entry) setTimeout(() => $('sAmount').focus(), 80);
  }
  function closeSheet() { state.sheet = null; $('scrim').hidden = true; $('sheet').hidden = true; }

  function renderSheet() {
    const s = state.sheet; if (!s) return;
    const pay = s.kind === 'payment', edit = !!s.id;
    $('sTitle').textContent = edit ? 'Buchung ändern' : pay ? 'Ausgleichszahlung' : 'Neue Ausgabe';
    setSeg($('sKind'), pay ? 1 : 0);
    $('sExp').setAttribute('aria-pressed', !pay); $('sPay').setAttribute('aria-pressed', pay);
    $('sKind').hidden = edit && !!s.recurring;
    $('sLabelHint').textContent = pay ? 'Notiz' : 'Wofür';
    $('sLabel').placeholder = pay ? 'z. B. PayPal Oktober' : 'z. B. Edeka';
    $('sPayerHint').textContent = pay ? 'Wer hat überwiesen?' : 'Bezahlt von';
    $('sJt').textContent = pay ? 'Jan an Milena' : 'Jan';
    $('sMt').textContent = pay ? 'Milena an Jan' : 'Milena';
    setSeg($('sPayer'), s.payer === 'M' ? 1 : 0);
    $('sJ').setAttribute('aria-pressed', s.payer === 'J'); $('sM').setAttribute('aria-pressed', s.payer === 'M');
    $('sCatField').hidden = pay;
    $('sCats').innerHTML = Object.entries(CATS).map(([k, n]) => '<button type="button" class="press" data-cat="' + k + '" aria-pressed="' + (s.category === k) + '">' + esc(n) + '</button>').join('');
    // Vorschläge: häufige Stichwörter, passend zum Getippten
    const q = $('sLabel').value.trim().toLowerCase();
    const sug = pay ? [] : (state.data?.labels || []).filter(l => !q || (l.label.toLowerCase().startsWith(q) && l.label.toLowerCase() !== q)).slice(0, 10);
    $('sSuggest').innerHTML = sug.map(l => '<button type="button" class="press" data-sug="' + esc(l.label) + '">' + esc(l.label) + '</button>').join('');
    $('sSuggest').hidden = !sug.length;
    $('sRecWrap').hidden = pay || edit;
    $('sRuleWrap').hidden = !(edit && s.recurring);
    $('sSave').textContent = edit ? 'Speichern' : pay ? 'Zahlung eintragen' : 'Eintragen';
    $('sEditBtns').hidden = !edit;
    $('sDel').textContent = s.confirmDel ? 'Wirklich löschen?' : 'Löschen';
    $('sStop').hidden = !(edit && s.recurring && !s.recurringEnd);
    $('sStop').textContent = s.confirmStop ? 'Ab ' + monthName(addMonth(s.month, 1)) + ' beenden?' : 'Nicht mehr wiederholen';
  }
  const setMsg = t => { $('sMsg').textContent = t || ''; $('sMsg').hidden = !t; };

  $('addBtn').onclick = () => openSheet(null);
  $('sClose').onclick = closeSheet;
  $('scrim').onclick = closeSheet;
  document.addEventListener('keydown', ev => {
    if (ev.key !== 'Escape') return;
    if (state.sheet) closeSheet(); else $('menu').hidden = true;
  });
  $('sExp').onclick = () => { state.sheet.kind = 'expense'; renderSheet(); };
  $('sPay').onclick = () => {
    const s = state.sheet; s.kind = 'payment';
    // Vorschlag: wer schuldet, überweist den offenen Betrag
    const bal = state.data ? sums(state.data.entries).bal : 0;
    if (!s.id && bal) { s.payer = bal > 0 ? 'M' : 'J'; if (!$('sAmount').value) { $('sAmount').value = fmtNum(Math.abs(bal)); sizeAmount(); } }
    renderSheet();
  };
  $('sJ').onclick = () => { state.sheet.payer = 'J'; renderSheet(); };
  $('sM').onclick = () => { state.sheet.payer = 'M'; renderSheet(); };
  $('sLabel').addEventListener('input', () => {
    const s = state.sheet; if (!s) return;
    if (!s.catTouched) s.category = guessCategory($('sLabel').value) || 'sonstiges';
    renderSheet();
  });
  $('sheet').addEventListener('click', ev => {
    const c = ev.target.closest('[data-cat]');
    if (c) { state.sheet.category = c.dataset.cat; state.sheet.catTouched = true; renderSheet(); return; }
    const sg = ev.target.closest('[data-sug]');
    if (sg) {
      $('sLabel').value = sg.dataset.sug;
      if (!state.sheet.catTouched) state.sheet.category = guessCategory(sg.dataset.sug) || 'sonstiges';
      renderSheet();
      if (!$('sAmount').value) $('sAmount').focus();
    }
  });

  let saving = false;
  $('sheet').onsubmit = async ev => {
    ev.preventDefault();
    const s = state.sheet; if (!s || saving) return;
    const amount = parseAmount($('sAmount').value);
    const pay = s.kind === 'payment';
    const label = $('sLabel').value.trim() || (pay ? 'Ausgleichszahlung' : '');
    const date = $('sDate').value;
    if (!amount) { setMsg('Bitte einen Betrag eingeben, zum Beispiel 13,50.'); $('sAmount').focus(); return; }
    if (!label) { setMsg('Wofür war die Ausgabe? Ein Stichwort reicht.'); $('sLabel').focus(); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { setMsg('Bitte ein Datum wählen.'); return; }
    const body = { date, amount_cents: amount, label, category: s.category, payer: s.payer, kind: s.kind, by: state.me };
    saving = true; $('sSave').disabled = true; setMsg('');
    try {
      if (s.id) await api('/entries/' + s.id, { method: 'PUT', body: { ...body, applyToRule: !!s.recurring && $('sRule').checked } });
      else await api('/entries', { method: 'POST', body: { ...body, recurring: !pay && $('sRec').checked } });
      closeSheet();
      const target = date.slice(0, 7);
      toast(s.id ? 'Gespeichert' : fmt(amount) + ' eingetragen' + (target !== state.month ? ' in ' + monthName(target) : ''));
      await load();
    } catch (e) { if (e instanceof AuthError) { closeSheet(); showLogin(e.message); } else setMsg(e.message); }
    finally { saving = false; $('sSave').disabled = false; }
  };
  $('sDel').onclick = async () => {
    const s = state.sheet; if (!s?.id) return;
    if (!s.confirmDel) { s.confirmDel = true; renderSheet(); return; }
    try { await api('/entries/' + s.id, { method: 'DELETE' }); closeSheet(); toast('Gelöscht'); await load(); }
    catch (e) { setMsg(e.message); }
  };
  $('sStop').onclick = async () => {
    const s = state.sheet; if (!s?.recurring) return;
    if (!s.confirmStop) { s.confirmStop = true; renderSheet(); return; }
    try { await api('/recurring/' + s.recurring + '?month=' + s.month, { method: 'DELETE' }); closeSheet(); toast('Wiederholung beendet'); await load(); }
    catch (e) { setMsg(e.message); }
  };

  // ---------- Aktuell halten ----------
  // Alle 30 Sekunden und beim Zurückkehren in die App neu laden, damit ihr beide denselben Stand seht.
  setInterval(() => { if (document.visibilityState === 'visible' && !state.sheet && !$('app').hidden) load(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !state.sheet && !$('app').hidden) load(); });

  // Erst nach der Antwort des Servers zeigen: Anmeldung, Personenwahl oder App
  load();
})();
</script>
</body>
</html>
